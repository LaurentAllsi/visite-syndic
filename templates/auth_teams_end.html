<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Connexion…</title>
<script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>
</head>
<body>
<script>
microsoftTeams.app.initialize().then(function() {
  {% if error %}
  microsoftTeams.authentication.notifyFailure("{{ error }}");
  {% else %}
  microsoftTeams.authentication.notifySuccess("{{ token }}");
  {% endif %}
}).catch(function() {
  // Hors Teams — redirection directe
  {% if error %}
  window.location.href = "/login?error={{ error | urlencode }}";
  {% else %}
  window.location.href = "/auth/teams-complete?token={{ token }}";
  {% endif %}
});
</script>
</body>
</html>
