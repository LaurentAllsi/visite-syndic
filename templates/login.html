<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Visite Syndic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-bg d-flex align-items-center justify-content-center min-vh-100">
<div class="login-card">
  <div class="login-logo">Laforêt<span>.</span></div>
  <p class="login-sub">Syndic · Visites d'immeubles</p>

  {% for cat, msg in get_flashed_messages(with_categories=True) %}
  <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
  {% endfor %}

  <form method="post">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Votre prénom</label>
      <input type="text" name="username" class="form-control" placeholder="Ex : Laurent"
             value="{{ request.form.get('username','') }}" autocomplete="name">
    </div>
    <div class="mb-4">
      <label class="form-label small fw-semibold">Mot de passe</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-lf w-100 py-2 fw-semibold">
      Se connecter
    </button>
  </form>
</div>
</body>
</html>
